<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پیاده‌روی خانوادگی شهید کاووسی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  --night:#16342d; --moss:#245046; --mist:#e8efea; --paper:#fbfcfb;
  --tulip:#b3261e; --sand:#c9b27c; --ink:#1b2a26; --line:#cbd8d1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Vazirmatn,Tahoma,sans-serif;background:var(--mist);color:var(--ink);line-height:1.9}
header{background:var(--night);color:#fff;padding:44px 20px 64px;text-align:center;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--sand)}
.tulip{width:44px;height:44px;margin-bottom:6px}
h1{margin:0;font-size:clamp(28px,7vw,46px);font-weight:800;line-height:1.5}
header p{margin:6px 0 0;color:#cfe0d8;font-size:15px}
main{max-width:560px;margin:-34px auto 40px;padding:0 16px;position:relative}
.card{background:var(--paper);border-radius:14px;padding:26px 22px;box-shadow:0 10px 30px rgba(22,52,45,.14)}
.lead{margin:0 0 22px;font-weight:600;color:var(--moss)}
fieldset{border:0;padding:0;margin:0 0 22px}
label,legend{display:block;font-weight:600;margin-bottom:8px;padding:0}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:3px solid rgba(36,80,70,.3);border-color:var(--moss)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
@media(max-width:420px){.names{grid-template-columns:1fr}}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choices label{flex:1 1 0;min-width:64px;margin:0}
.choices input{position:absolute;opacity:0;pointer-events:none}
.choices span{display:block;text-align:center;padding:11px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-weight:600;transition:background .15s,color .15s,border-color .15s}
.choices input:focus-visible+span{outline:3px solid rgba(36,80,70,.4)}
.choices input:checked+span{background:var(--moss);border-color:var(--moss);color:#fff}
.choices.yn input[value=no]:checked+span{background:var(--tulip);border-color:var(--tulip)}
#companionBox{display:none}
#companionBox.show{display:block}
button.submit{width:100%;font:inherit;font-weight:800;font-size:17px;padding:14px;border:0;border-radius:10px;background:var(--night);color:#fff;cursor:pointer}
button.submit:hover{background:var(--moss)}
button.submit:disabled{opacity:.6;cursor:wait}
button.submit:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.err{color:var(--tulip);font-weight:600;min-height:1.6em;margin:0 0 10px}
.done{text-align:center;display:none}
.done h2{margin:6px 0 8px;color:var(--moss)}
.done .badge{display:inline-block;margin-top:6px;padding:6px 18px;border-radius:99px;font-weight:800;color:#fff}
.badge.yes{background:var(--moss)} .badge.no{background:var(--tulip)}
.done button{margin-top:20px;font:inherit;background:none;border:0;color:var(--moss);text-decoration:underline;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <svg class="tulip" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6c-9 5-13 13-9 21 2 4 5 6 9 6s7-2 9-6c4-8 0-16-9-21z" fill="#d6453b"/><path d="M24 6c-3 6-3 14 0 27 3-13 3-21 0-27z" fill="#8f1b15"/><path d="M24 33v10M24 40c-5 0-8-2-10-5M24 40c5 0 8-2 10-5" stroke="#8fb59f" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
  <h1>پیاده‌روی خانوادگی شهید کاووسی</h1>
  <p>پایگاه الغدیر</p>
</header>

<main>
  <div class="card" id="formCard">
    <p class="lead">برای شرکت در پیاده‌روی پایگاه الغدیر فرم زیر را پر کنید</p>
    <form id="f" novalidate>
      <div class="names">
        <div><label for="fn">نام</label><input type="text" id="fn" autocomplete="given-name"></div>
        <div><label for="ln">نام خانوادگی</label><input type="text" id="ln" autocomplete="family-name"></div>
      </div>

      <fieldset>
        <legend>آیا در پیاده‌روی شرکت می‌کنید؟</legend>
        <div class="choices yn">
          <label><input type="radio" name="att" value="yes"><span>بله</span></label>
          <label><input type="radio" name="att" value="no"><span>خیر</span></label>
        </div>
      </fieldset>

      <fieldset id="companionBox">
        <legend>آیا همراه دارید؟ چند نفر؟</legend>
        <div class="choices">
          <label><input type="radio" name="comp" value="0" checked><span>هیچ‌کدام</span></label>
          <label><input type="radio" name="comp" value="1"><span>۱</span></label>
          <label><input type="radio" name="comp" value="2"><span>۲</span></label>
          <label><input type="radio" name="comp" value="3"><span>۳</span></label>
          <label><input type="radio" name="comp" value="4"><span>۴</span></label>
        </div>
      </fieldset>

      <p class="err" id="err" role="alert"></p>
      <button class="submit" id="btn" type="submit">ثبت</button>
    </form>
  </div>

  <div class="card done" id="done" aria-live="polite">
    <h2 id="dn"></h2>
    <span class="badge" id="dbadge"></span>
    <p id="dtext"></p>
    <button type="button" id="again">ثبت‌نام فرد دیگر</button>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);

document.querySelectorAll('input[name=att]').forEach((r) =>
  r.addEventListener("change", () => $("companionBox").classList.toggle("show", r.value === "yes" && r.checked))
);

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = "";
  const firstName = $("fn").value.trim(), lastName = $("ln").value.trim();
  const att = document.querySelector("input[name=att]:checked");
  if (!firstName || !lastName) return ($("err").textContent = "نام و نام خانوادگی را وارد کنید.");
  if (!att) return ($("err").textContent = "لطفاً بله یا خیر را انتخاب کنید.");
  const attending = att.value === "yes";
  const companions = attending ? +document.querySelector("input[name=comp]:checked").value : 0;

  $("btn").disabled = true; $("btn").textContent = "در حال ثبت…";
  try {
    const r = await fetch("/api/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ firstName, lastName, attending, companions }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "خطا");
    $("formCard").style.display = "none";
    $("done").style.display = "block";
    $("dn").textContent = firstName + " " + lastName;
    $("dbadge").textContent = attending ? "می‌آید" : "نمی‌آید";
    $("dbadge").className = "badge " + (attending ? "yes" : "no");
    $("dtext").textContent = attending
      ? "ثبت‌نام شما انجام شد." + (companions ? " همراه: " + fa(companions) + " نفر" : "")
      : "پاسخ شما ثبت شد. ممنون از اطلاع‌رسانی.";
  } catch (x) {
    $("err").textContent = x.message === "Failed to fetch" ? "اتصال برقرار نشد. دوباره تلاش کنید." : x.message;
  } finally {
    $("btn").disabled = false; $("btn").textContent = "ثبت";
  }
});

$("again").addEventListener("click", () => {
  $("f").reset(); $("companionBox").classList.remove("show");
  $("done").style.display = "none"; $("formCard").style.display = "block";
});
</script>
</body>
</html>
